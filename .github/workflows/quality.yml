name: Integrity checks (CPU)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax check (no GPU required)
        run: python -m compileall -q src scripts tests
      - name: Dataset unit tests
        run: python -m unittest discover -s tests -v
